apisix:
  extra_lua_path: "/opt/?.lua"
  node_listen: 9080
  enable_ipv6: false
  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

plugin_attr:
  custom-signature-authorizer:
    pub_keys:
      admin: "-----BEGIN PUBLIC KEY-----\\n-----END PUBLIC KEY-----"

plugins:
  - custom-signature-authorizer
